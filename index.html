<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mythic TD — Trade Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0f14; --panel:#0f1720; --muted:#9aa6b2; --accent:#60a5fa; --good:#22c55e; --bad:#ef4444; --glass: rgba(255,255,255,0.03);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
}
*{box-sizing:border-box;}
body{background:url('Dragon.png');background-size:cover;background-position:center;color:white;}
.wrap{max-width:1600px;margin:40px auto;padding:36px;backdrop-filter:blur(10px);background:rgba(15,23,32,0.75);border:1px solid rgba(255,255,255,0.05);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.7);transition:0.3s ease;}
header{text-align:center;}
h1{font-family:'Orbitron',sans-serif;font-size:32px;margin:0;letter-spacing:1px;color:var(--accent);text-shadow:0 0 15px rgba(96,165,250,0.6);}
p.lead{margin:6px 0 0;color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.panel{position:relative;background:var(--panel);padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,0.03);overflow:hidden;}
.panel.you,.panel.them{border:none;box-shadow:none;}
table{width:100%;border-collapse:collapse;font-size:16px; color:inherit;}
thead th{font-size:14px;text-align:left;padding:10px;color:var(--muted);letter-spacing:0.6px}
tbody td{padding:12px;border-top:1px dashed rgba(255,255,255,0.02)}
input[type="number"], select {
  background: rgba(255,255,255,0.03);
  color: white;
  border:1px solid rgba(255,255,255,0.05);
  padding:10px 12px;
  border-radius:8px;
  width:100%;
  font-size:16px;
  transition:all 0.2s;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
}
input:focus, select:focus {outline:none;border-color:var(--accent);box-shadow:0 0 6px rgba(96,165,250,0.5);background: rgba(15,23,32,0.8);color:white;}
.unitqty{width:70px !important;text-align:center;}
.unitvalue{width:100px !important;text-align:center;}
.row-actions{display:flex;gap:10px}
button{background:transparent;color:var(--accent);border:1px solid rgba(96,165,250,0.2);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:16px;transition:all .2s;}
button:hover{background:rgba(96,165,250,0.15);transform:translateY(-2px);}
.btn-primary{background:linear-gradient(90deg,#2563eb,#60a5fa);color:white;border:none;font-weight:600;box-shadow:0 0 10px rgba(96,165,250,0.3);}
.btn-primary:hover{opacity:0.9; transform:translateY(-2px);}
.muted{color:var(--muted);font-size:16px}
.totals{display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid rgba(255,255,255,0.03)}
.big{font-weight:700;font-size:24px;transition: all 0.2s ease;}
.result-msg{padding:14px 18px;border-radius:10px;font-size:17px}
.good{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.12);color:var(--good);}
.bad{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.12);color:var(--bad);}
.neutral{background:rgba(96,165,250,0.05);border:1px solid rgba(96,165,250,0.06);color:var(--accent);}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:10px}
.small{font-size:15px;padding:8px 10px}
footer{margin-top:20px;color:var(--muted);font-size:15px;text-align:center}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Mythic TD — Trade Calculator</h1></header>
<div class="grid">
  <div>
    <div class="panel you">
      <h3 style="font-size:20px;margin-top:0;">🛡️ Your Offer</h3>
      <table id="tblYou">
        <thead><tr><th>Unit</th><th>Mutation</th><th>Upgrade</th><th>Value</th><th>Qty</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="controls"><button id="addYou">+ Add Your Unit</button></div>
  </div>
  <div>
    <div class="panel them">
      <h3 style="font-size:20px;margin-top:0;">⚔️ Their Offer</h3>
      <table id="tblThem">
        <thead><tr><th>Unit</th><th>Mutation</th><th>Upgrade</th><th>Value</th><th>Qty</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="controls"><button id="addThem">+ Add Their Unit</button></div>
  </div>
</div>
<div class="controls"><button class="btn-primary" id="calc">Calculate</button></div>
<div style="margin-top:24px; background-color:black; color:white; padding:15px; border-radius:10px;">
  <div class="panel" style="min-width:340px">
    <h3 style="font-size:20px;margin-top:0;">Totals</h3>
    <div class="totals">
      <div class="tot"><div class="muted">Your Total</div><div class="big" id="totalYou">0</div></div>
      <div class="tot"><div class="muted">Their Total</div><div class="big" id="totalThem">0</div></div>
      <div class="tot"><div class="muted">Result</div><div class="big" id="tradeResult">—</div></div>
    </div>
    <div id="resultBox" class="result-msg neutral" style="margin-top:12px;">
      <div id="resultText">Press "Calculate" to check trade fairness.</div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <label class="muted small">Auto-round:</label>
      <select id="roundMode" class="small">
        <option value="0">None</option>
        <option value="1">1</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
      <button id="reset" class="small">Reset</button>
    </div>
  </div>
</div>
<footer>Mythic Tower Defense Trade Calculator — By Aztrol, IndieMindiYT, Polar, Set, Wavvy.</footer>
</div>

<script>
// ==== Unit Data ====
const unitValues = {
"Alchemist":130,"Athena":1400,"Basilisk":5,"Bat":30,"Cat Wizard":1800,"Centaur":30,"Cerberus":90,"Cyclopse":650,"Demon Fox":1500,"Dragon":20,"Dragon Egg":1350,"Dragon Turtle":1500,"Dwarf":25,"Fairy":25,"Flame Knight":1300,"Frost Wizard":1200,"Genie":700,"Ghost":130,"Goblin King":700,"Golem":950,"Griffin":5,"Guardian":85,"Harpy":50,"Headless":1620,"Hydra":900,"Ice Dragon":600,"King":1500,"Kitsune":1200,"Knight":5,"Kraken":90,"Limitless Wizard":1310,"Magma Titan":700,"Medusa":60,"Mermaid":30,"Mine":120,"Minotaur":50,"Monk":2500,"Mountain King":1600,"Pegasus":1000,"Pheonix":120,"Plantera":850,"Poison Dragon":300,"Princess":950,"Pumpkin Knight":900,"Queen":850,"RA":700,"Reaper":1040,"Rock Dragon":950,"Samurai":350,"Satyr":600,"Shadow Knight":400,"Slime":40,"Spider":80,"Spirit Deer":450,"Spooky Hydra":850,"Thunderbird":400,"Titan":350,"Unicorn":5,"Vampire":1640,"Witch":400,"Wizard":400,"Zeus":1700,"Gnome":2500
};
const unitRanks = {"Alchemist":"S","Athena":"A","Basilisk":"D","Bat":"A","Cat Wizard":"S","Centaur":"D","Cerberus":"D","Cyclopse":"B","Demon Fox":"S","Dragon":"B","Dragon Egg":"A","Dragon Turtle":"S","Dwarf":"C","Fairy":"D","Flame Knight":"S","Frost Wizard":"A","Genie":"B","Ghost":"S","Goblin King":"A","Golem":"B","Griffin":"D","Guardian":"D","Harpy":"C","Headless":"S","Hydra":"B","Ice Dragon":"B","King":"S","Kitsune":"S","Knight":"D","Kraken":"A","Limitless Wizard":"S","Magma Titan":"B","Medusa":"E","Mermaid":"D","Mine":"A","Minotaur":"D","Monk":"S","Mountain King":"S","Pegasus":"C","Pheonix":"C","Plantera":"A","Poison Dragon":"B","Princess":"A","Pumpkin Knight":"A","Queen":"A","RA":"B","Reaper":"A","Rock Dragon":"A","Samurai":"S","Satyr":"A","Shadow Knight":"B","Slime":"D","Spider":"C","Spirit Deer":"E","Spooky Hydra":"B","Thunderbird":"C","Titan":"C","Unicorn":"D","Vampire":"S","Witch":"C","Wizard":"D","Zeus":"S","Gnome":"S"};
const limitedUnits = {"Alchemist":1,"Bat":1,"Cat Wizard":1,"Demon Fox":1,"Dragon Egg":1,"Ghost":1,"Headless":1,"Kitsune":1,"Limitless Wizard":1,"Monk":1,"Pegasus":1,"Pumpkin Knight":1,"Reaper":1,"Rock Dragon":1,"Samurai":1,"Shadow Knight":1,"Spider":1,"Spooky Hydra":1,"Vampire":1,"Witch":1,"Zeus":1};

// ==== Rarity & Colors ====
const unitRarity = {
"Alchemist":"Uncommon","Athena":"Mythic","Basilisk":"Common","Bat":"Common","Cat Wizard":"Mythic","Centaur":"Rare","Cerberus":"Epic","Cyclopse":"Legendary","Demon Fox":"Mythic","Dragon":"Uncommon","Dragon Egg":"Mythic","Dragon Turtle":"Mythic","Dwarf":"Rare","Fairy":"Rare","Flame Knight":"Mythic","Frost Wizard":"Mythic","Genie":"Mythic","Ghost":"Uncommon","Goblin King":"Mythic","Golem":"Mythic","Griffin":"Common","Guardian":"Epic","Harpy":"Rare","Headless":"Mythic","Hydra":"Mythic","Ice Dragon":"Legendary","King":"Mythic","Kitsune":"Legendary","Knight":"Common","Kraken":"Uncommon","Limitless Wizard":"Legendary","Magma Titan":"Mythic","Medusa":"Uncommon","Mermaid":"Uncommon","Mine":"Rare","Minotaur":"Epic","Monk":"Unique","Mountain King":"Mythic","Pegasus":"Legendary","Pheonix":"Epic","Plantera":"Legendary","Poison Dragon":"Epic","Princess":"Legendary","Pumpkin Knight":"Legendary","Queen":"Legendary","RA":"Mythic","Reaper":"Mythic","Rock Dragon":"Mythic","Samurai":"Rare","Satyr":"Epic","Shadow Knight":"Epic","Slime":"Common","Spider":"Rare","Spirit Deer":"Legendary","Spooky Hydra":"Mythic","Thunderbird":"Legendary","Titan":"Epic","Unicorn":"Common","Vampire":"Mythic","Witch":"Epic","Wizard":"Legendary","Zeus":"Mythic","Gnome":"Unique"
};
const rarityColors = {"Common":"#808080","Uncommon":"#22c55e","Rare":"#3b82f6","Epic":"#a855f7","Legendary":"#facc15","Mythic":"#ef4444","Unique":"#f9a8d4"};

// ==== Upgrade Copies per Star ====
const copiesPerStar = {"Common":12,"Uncommon":10,"Rare":8,"Epic":7,"Legendary":5,"Mythic":4,"Unique":4};
const mutationMult = { "Normal":1,"Silver":1.23,"Gold":1.35,"Rainbow":1.55 };

// ==== Helpers ====
function el(q){return document.querySelector(q);}
function createRow(side){
  const tr=document.createElement('tr');
  const options = Object.keys(unitValues).map(u=>`<option value="${u}">${u}${limitedUnits[u]?' ⭐':''}</option>`).join('');
  const mutationOptions = ["Normal","Silver","Gold","Rainbow"].map(m=>`<option value="${m}">${m}</option>`).join('');
  const upgradeOptions = [0,1,2,3,4,5].map(s=>`<option value="${s}">${s}★</option>`).join('');
  tr.innerHTML=`
  <td><select class="unitname"><option value="">Select Unit</option>${options}</select></td>
  <td><select class="mutation">${mutationOptions}</select></td>
  <td><select class="upgrade">${upgradeOptions}</select></td>
  <td><input type="number" class="unitvalue" readonly></td>
  <td><input type="number" class="unitqty" value="1" min="1"></td>
  <td class="row-actions"><button class="del small">Delete</button></td>`;
  const tbl=side==='you'?el('#tblYou tbody'):el('#tblThem tbody');
  tbl.appendChild(tr);
  
  function updateAll(){
    const unit = tr.querySelector('.unitname').value.replace(' ⭐','');
    const rarity = unitRarity[unit] || "Common";
    tr.style.backgroundColor = rarityColors[rarity]+"33";
    updateRowValue(tr);
  }
  tr.querySelectorAll('select,input').forEach(i=>i.addEventListener('change',updateAll));
  tr.querySelector('.del').addEventListener('click',()=>{tr.remove();updateTotals();});
  updateAll();
  return tr;
}

// ==== Calculate Upgrade Value ====
function calcUpgrade(unit, upgrade){
  if(!unit) return 1;
  const rarity = unitRarity[unit] || "Common";
  const base = unitValues[unit]||0;
  const copies = copiesPerStar[rarity]||1;
  const totalCopies = copies * upgrade;
  return base + base*totalCopies; // base + base*copies*upgrade
}

// ==== Update Row Value ====
function updateRowValue(tr){
  const unit = tr.querySelector('.unitname').value.replace(' ⭐','');
  const mut = tr.querySelector('.mutation').value;
  const upg = Number(tr.querySelector('.upgrade').value)||0;
  const qty = Number(tr.querySelector('.unitqty').value)||1;
  
  let val = calcUpgrade(unit,upg);
  val *= mutationMult[mut]||1;
  if(limitedUnits[unit] && mut!=='Normal') val*=2;
  tr.querySelector('.unitvalue').value=Math.round(val*qty);
  updateTotals();
}

// ==== Totals ====
function parseTable(sel){
  const rows=[...document.querySelectorAll(sel+' tr')]; let total=0;
  rows.forEach(r=>{
    const unit=r.querySelector('.unitname')?.value.replace(' ⭐','');
    const mut=r.querySelector('.mutation')?.value;
    const upg=r.querySelector('.upgrade')?.value;
    const qty=Number(r.querySelector('.unitqty')?.value)||0;
    const val = calcUpgrade(unit,Number(upg)) * (mutationMult[mut]||1) * (limitedUnits[unit] && mut!=='Normal'?2:1);
    total+=val*qty;
  });
  return total;
}

function updateTotals(){
  const y=parseTable('#tblYou tbody'), t=parseTable('#tblThem tbody');
  el('#totalYou').textContent=format(y);
  el('#totalThem').textContent=format(t);
  const resultEl=el('#tradeResult');
  if(y>t){resultEl.textContent="LOSE"; resultEl.className="big lose";}
  else if(t>y){resultEl.textContent="WIN"; resultEl.className="big win";}
  else{resultEl.textContent="DRAW"; resultEl.className="big";}
}

function format(n){ const r=Number(el('#roundMode').value); if(r>0)n=Math.round(n/r)*r; return n.toLocaleString(); }

// ==== Init ====
createRow('you'); createRow('them');
el('#addYou').addEventListener('click',()=>createRow('you'));
el('#addThem').addEventListener('click',()=>createRow('them'));
el('#reset').addEventListener('click',()=>{el('#tblYou tbody').innerHTML='';el('#tblThem tbody').innerHTML='';createRow('you');createRow('them');updateTotals();el('#resultText').textContent='Reset done.';});

// ==== Calculate Button ====
document.getElementById('calc').addEventListener('click',()=>{
  const y=parseTable('#tblYou tbody'), t=parseTable('#tblThem tbody');
  const diff=t-y;
  const msgBox=el('#resultBox'), msgText=el('#resultText');
  if(y===0 && t===0){msgBox.className='result-msg neutral'; msgText.textContent='Please add some units first.'; return;}
  if(Math.abs(diff)<y*0.05){msgBox.className='result-msg neutral'; msgText.textContent='⚖️ This trade looks fair!';}
  else if(diff>0){msgBox.className='result-msg good'; msgText.textContent='✅ You’re getting a good deal! ('+format(diff)+' value gain)';}
  else{msgBox.className='result-msg bad'; msgText.textContent='❌ You’re overpaying by '+format(-diff)+' value.';}
  updateTotals();
});
</script>
</body>
</html>
